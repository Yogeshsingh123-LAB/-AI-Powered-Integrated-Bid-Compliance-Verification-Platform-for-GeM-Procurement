services:
  # -------------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: gem_bid_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bid_compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # FastAPI Backend AI Scorer & Document Processor
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gem_bid_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/bid_compliance_db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@gem.gov.in}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      - SUPABASE_URL=${SUPABASE_URL:?Set SUPABASE_URL in .env}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in .env}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-bid-documents}
      - GEM_USE_MOCK=${GEM_USE_MOCK:-true}
      - ENABLE_REAL_API_LOOKUP=${ENABLE_REAL_API_LOOKUP:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-20b
      - GROQ_WEB_SEARCH_ENABLED=true
      - GROQ_WEB_MODEL=groq/compound-mini

    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------
  # React/Vite Frontend Web Interface
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gem_bid_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
